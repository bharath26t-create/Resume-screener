<!DOCTYPE html>
<html>
<head>
  <title>Smart Resume Screener</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
    textarea { width: 100%; height: 120px; }
    #result { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 6px; white-space: pre-wrap; }
    table { width: 100%; border-collapse: collapse; margin-top: 30px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  </style>
</head>
<body>
  <h1>Smart Resume Screener</h1>

  <form id="screenForm">
    <label>Resume (PDF or .txt):</label><br>
    <input type="file" id="resumeFile" accept=".pdf,.txt" required><br><br>

    <label>Job Description:</label><br>
    <textarea id="jobDescription" required></textarea><br><br>

    <button type="submit">Screen Resume</button>
  </form>

  <div id="result"></div>

  <h2>All Screened Candidates</h2>
  <table id="candidateTable">
    <thead><tr><th>Filename</th><th>Score</th><th>Predicted Category</th><th>Justification</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadCandidates() {
      const res = await fetch('/candidates');
      const data = await res.json();
      const tbody = document.querySelector('#candidateTable tbody');
      tbody.innerHTML = '';
      data.forEach(c => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${c.filename}</td><td>${c.score}/10</td><td>${c.predicted_category || '-'}</td><td>${c.justification}</td>`;
        tbody.appendChild(row);
      });
    }

    document.getElementById('screenForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('resume', document.getElementById('resumeFile').files[0]);
      formData.append('job_description', document.getElementById('jobDescription').value);

      document.getElementById('result').textContent = 'Screening...';
      const res = await fetch('/screen', { method: 'POST', body: formData });
      const data = await res.json();

      if (data.error) {
        document.getElementById('result').textContent = 'Error: ' + data.error;
        return;
      }

      document.getElementById('result').textContent =
        `Score: ${data.score}/10\n\nPredicted Category: ${data.predicted_category} (confidence: ${data.category_confidence})\n\nJustification: ${data.justification}\n\nExtracted: ${JSON.stringify(data.extracted, null, 2)}`;
      loadCandidates();
    });

    loadCandidates();
  </script>
</body>
</html>
